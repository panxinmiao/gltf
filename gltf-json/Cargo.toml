[package]
name = "myth-gltf-json"
version = "1.4.2"
authors = ["Pan Xinmiao <pan_xinmiao@163.com>", "David Harvey-Macaulay <alteous@outlook.com>"]
description = "JSON parsing for the myth-gltf crate (fork)"
repository = "https://github.com/panxinmiao/gltf"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.61"

[lib]
name = "gltf_json"

[dependencies]
gltf-derive = { package = "myth-gltf-derive", path = "../gltf-derive", version = "=1.4.2" }
serde = "1.0"
serde_derive = "1.0"
serde_json = { features = ["raw_value"], version = "1.0" }

[features]
default = []
allow_empty_animation_target_node = []
allow_empty_texture = []
names = []
extensions = []
extras = []
KHR_lights_punctual = []
KHR_materials_ior = []
KHR_materials_pbrSpecularGlossiness = []
KHR_materials_specular = []
KHR_materials_sheen = []
KHR_materials_clearcoat = []
KHR_materials_transmission = []
KHR_materials_unlit = []
KHR_materials_variants = []
KHR_materials_volume = []
KHR_texture_transform = []
KHR_materials_emissive_strength = []
KHR_mesh_quantization = []
EXT_texture_webp = []
EXT_meshopt_compression = []
